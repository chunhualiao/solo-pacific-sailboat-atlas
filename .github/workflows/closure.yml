name: Issue closure policy
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: read
jobs:
  closure-policy:
    runs-on: ubuntu-latest
    steps:
      # No checkout or execution of pull-request code.
      - uses: actions/github-script@v7
        with:
          script: |
            const params = {owner: context.repo.owner, repo: context.repo.repo, pull_number: context.issue.number};
            const {data: pr} = await github.rest.pulls.get(params);
            const commits = await github.paginate(github.rest.pulls.listCommits, params);
            if (!pr.body || !/^## Acceptance evidence\s*$/mi.test(pr.body) || !/^## Remaining work\s*$/mi.test(pr.body)) {
              core.setFailed('PR must contain Acceptance evidence and Remaining work sections.'); return;
            }
            const text = [pr.title, pr.body, ...commits.map(c => c.commit.message)].join('\n');
            const closing = /\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*(?:[\w.-]+\/[\w.-]+)?#\d+|\b(close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*:?\s*https:\/\/[^\s]+\/issues\/\d+/i;
            if (closing.test(text)) core.setFailed('Use non-closing issue references; acceptance must be reviewed separately.');
